services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campusflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  campusflow_pgdata:
    driver: local
