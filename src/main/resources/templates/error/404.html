<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Page Not Found')}">
    <title>Page Not Found — CampusFlow</title>
</head>
<body class="auth-body">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 3.5rem; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
        <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--neutral-900); margin: 0.75rem 0 0.5rem;">Page Not Found</h1>
        <p style="color: var(--neutral-600); font-size: 0.925rem; margin-bottom: 1.75rem;"
           th:text="${errorMessage != null ? errorMessage : 'The assignment, subject, or page you were looking for does not exist or has been removed.'}">
            The page you requested could not be found.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
            <a th:href="@{/assignments}" class="btn btn-secondary">View Assignments</a>
        </div>
    </div>
</body>
</html>
