<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Server Error')}">
    <title>Server Error — CampusFlow</title>
</head>
<body class="auth-body">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 3.5rem; font-weight: 800; color: var(--warning); line-height: 1;">500</div>
        <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--neutral-900); margin: 0.75rem 0 0.5rem;">Internal Server Error</h1>
        <p style="color: var(--neutral-600); font-size: 0.925rem; margin-bottom: 1.75rem;"
           th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again later.'}">
            An unexpected error occurred while processing your request.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
