<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Access Denied')}">
    <title>Access Denied — CampusFlow</title>
</head>
<body class="auth-body">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 3.5rem; font-weight: 800; color: var(--danger); line-height: 1;">403</div>
        <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--neutral-900); margin: 0.75rem 0 0.5rem;">Access Denied</h1>
        <p style="color: var(--neutral-600); font-size: 0.925rem; margin-bottom: 1.75rem;"
           th:text="${errorMessage != null ? errorMessage : 'You do not have permission to view or modify this resource.'}">
            You do not have permission to access this resource.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Return to Dashboard</a>
            <a th:href="@{/assignments}" class="btn btn-secondary">My Assignments</a>
        </div>
    </div>
</body>
</html>
