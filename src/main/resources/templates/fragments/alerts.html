<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alerts">
    <div th:if="${successMessage != null}" class="alert alert-success" role="alert">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span th:text="${successMessage}">Operation successful!</span>
        </div>
        <button type="button" class="alert-close" aria-label="Close alert">&times;</button>
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${errorMessage}">An error occurred.</span>
        </div>
        <button type="button" class="alert-close" aria-label="Close alert">&times;</button>
    </div>

    <div th:if="${warningMessage != null}" class="alert alert-warning" role="alert">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span th:text="${warningMessage}">Warning notice.</span>
        </div>
        <button type="button" class="alert-close" aria-label="Close alert">&times;</button>
    </div>
</div>
</html>
