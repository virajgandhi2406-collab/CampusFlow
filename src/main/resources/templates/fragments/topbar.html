<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="topbar(pageTitle)" class="topbar">
    <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle navigation menu">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <h1 class="page-title" th:text="${pageTitle}">Page Title</h1>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem;">
        <span style="font-size: 0.85rem; color: var(--neutral-500); font-weight: 500;"
              th:text="${#temporals.format(#temporals.createNow(), 'EEEE, MMMM d')}">
            Current Date
        </span>
    </div>
</header>
</html>
