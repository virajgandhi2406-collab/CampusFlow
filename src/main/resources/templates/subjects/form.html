<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Edit Subject' : 'Add Subject')}">
    <title>Subject Form — CampusFlow</title>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside th:replace="~{fragments/sidebar :: sidebar(${activeNav})}"></aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <!-- Topbar Header -->
            <header th:replace="~{fragments/topbar :: topbar(${isEdit ? 'Edit Subject' : 'Create New Subject'})}"></header>

            <main class="content-body">
                <!-- Alerts / Flash Messages -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card" style="max-width: 680px; margin: 0 auto;">
                    <div class="card-header">
                        <h2 class="card-title" th:text="${isEdit ? 'Update Subject Details' : 'Subject Details'}">Subject Information</h2>
                    </div>
                    <div class="card-body">
                        <form th:action="${isEdit ? '/subjects/' + subjectDto.id + '/edit' : '/subjects'}"
                              th:object="${subjectDto}" method="post">

                            <div class="form-group">
                                <label for="name" class="form-label">Subject / Course Name <span style="color: var(--danger);">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="e.g. CS 301 — Operating Systems" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="form-group">
                                <label for="color" class="form-label">Accent Color Code <span style="color: var(--danger);">*</span></label>
                                <div style="display: flex; gap: 0.75rem; align-items: center;">
                                    <input type="color" id="colorPicker" th:value="*{color}"
                                           style="width: 48px; height: 38px; border: 1px solid var(--neutral-300); border-radius: var(--radius-sm); cursor: pointer; padding: 2px;"
                                           onchange="document.getElementById('color').value = this.value">
                                    <input type="text" id="color" th:field="*{color}" class="form-control"
                                           th:classappend="${#fields.hasErrors('color')} ? 'is-invalid' : ''"
                                           placeholder="#4f46e5" pattern="^#([A-Fa-f0-9]{6})$" required
                                           onchange="document.getElementById('colorPicker').value = this.value">
                                </div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
                                <small class="form-text">Choose a distinct color for badges and visual identification.</small>
                            </div>

                            <div class="form-group">
                                <label for="description" class="form-label">Description / Syllabus Notes</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          placeholder="Professor contact, office hours, grading weightage, textbook links..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                                <a th:href="@{/subjects}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Save Changes' : 'Create Subject'}">
                                    Submit
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Footer -->
                <footer th:replace="~{fragments/footer :: footer}"></footer>
            </main>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
